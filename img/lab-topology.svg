<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1380" viewBox="0 0 1200 690" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Calico Enterprise networking training: lab topology</title>
  <defs>
    <style>@font-face{font-family:'Poppins';font-weight:400;src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:'Poppins';font-weight:700;src:url(data:font/woff;base64,) format('woff');}</style>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#09287D"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D9861A"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#09287D" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="690" rx="16" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="1199" height="689" rx="16" fill="none" stroke="#D5DEE8"/>

  <!-- Title -->
  <text x="40" y="52" font-size="26" font-weight="700" fill="#1E4E79">Lab topology</text>
  <text x="40" y="78" font-size="14" fill="#595959">One lab instance per trainee · all commands run from the bastion</text>

  <!-- Kubernetes cluster -->
  <rect x="380" y="100" width="780" height="480" rx="14" fill="#EEF5FB" stroke="#1084B7" stroke-width="2"/>
  <g transform="translate(404,118)">
    <!-- simple helm-wheel mark -->
    <circle cx="13" cy="13" r="13" fill="#326CE5"/>
    <circle cx="13" cy="13" r="6" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
      <line x1="13" y1="3" x2="13" y2="7"/><line x1="13" y1="19" x2="13" y2="23"/>
      <line x1="3" y1="13" x2="7" y2="13"/><line x1="19" y1="13" x2="23" y2="13"/>
      <line x1="6" y1="6" x2="9" y2="9"/><line x1="17" y1="17" x2="20" y2="20"/>
      <line x1="20" y1="6" x2="17" y2="9"/><line x1="9" y1="17" x2="6" y2="20"/>
    </g>
  </g>
  <text x="442" y="137" font-size="17" font-weight="700" fill="#09287D">Kubernetes cluster</text>
  <text x="442" y="156" font-size="12.5" fill="#595959">Calico Enterprise CNI and network policy</text>

  <!-- control-plane to worker links -->
  <path d="M720,275 C720,322 570,322 570,370" fill="none" stroke="#9FB3C8" stroke-width="2"/>
  <path d="M820,275 C820,322 970,322 970,370" fill="none" stroke="#9FB3C8" stroke-width="2"/>

  <!-- control1 -->
  <g filter="url(#shadow)">
    <rect x="650" y="185" width="240" height="90" rx="12" fill="#09287D"/>
  </g>
  <text x="770" y="218" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">control1</text>
  <text x="770" y="241" text-anchor="middle" font-size="16" fill="#FFFFFF">10.0.1.20</text>
  <text x="770" y="261" text-anchor="middle" font-size="12.5" fill="#C9D6F2">Kubernetes control plane</text>

  <!-- worker1 -->
  <g filter="url(#shadow)">
    <rect x="450" y="370" width="240" height="90" rx="12" fill="#1084B7"/>
  </g>
  <text x="570" y="403" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">worker1</text>
  <text x="570" y="426" text-anchor="middle" font-size="16" fill="#FFFFFF">10.0.1.30</text>
  <text x="570" y="446" text-anchor="middle" font-size="12.5" fill="#DDEFF7">application workloads</text>

  <!-- worker2 -->
  <g filter="url(#shadow)">
    <rect x="850" y="370" width="240" height="90" rx="12" fill="#1084B7"/>
  </g>
  <text x="970" y="403" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">worker2</text>
  <text x="970" y="426" text-anchor="middle" font-size="16" fill="#FFFFFF">10.0.1.31</text>
  <text x="970" y="446" text-anchor="middle" font-size="12.5" fill="#DDEFF7">application workloads</text>

  <!-- in-cluster networks -->
  <rect x="470" y="526" width="600" height="34" rx="17" fill="#FFFFFF" stroke="#BFD3E6"/>
  <text x="770" y="548" text-anchor="middle" font-size="13.5" fill="#1E4E79">Pods <tspan font-weight="700">10.48.0.0/16</tspan>   ·   Services <tspan font-weight="700">10.49.0.0/16</tspan></text>

  <!-- bastion -->
  <g filter="url(#shadow)">
    <rect x="60" y="130" width="230" height="122" rx="12" fill="#FBAE40"/>
  </g>
  <text x="175" y="162" text-anchor="middle" font-size="20" font-weight="700" fill="#09287D">bastion</text>
  <text x="175" y="185" text-anchor="middle" font-size="16" fill="#09287D">10.0.1.10</text>
  <text x="175" y="210" text-anchor="middle" font-size="12.5" fill="#09287D">you run kubectl · calicoctl here</text>
  <text x="175" y="230" text-anchor="middle" font-size="12.5" fill="#09287D">BIRD upstream router · AS 64512</text>

  <!-- bastion -> control1 (API) -->
  <path d="M290,230 L644,230" fill="none" stroke="#09287D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
  <text x="520" y="220" text-anchor="middle" font-size="13" fill="#09287D">kubectl · calicoctl</text>

  <!-- bastion <-> nodes BGP -->
  <path d="M250,252 C250,330 330,345 444,400" fill="none" stroke="#D9861A" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-orange)"/>
  <text x="236" y="282" text-anchor="end" font-size="12.5" fill="#B5650A">BGP peering with</text>
  <text x="236" y="298" text-anchor="end" font-size="12.5" fill="#B5650A">all three nodes</text>
  <text x="236" y="314" text-anchor="end" font-size="12.5" fill="#B5650A">(modules 3–5)</text>

  <!-- AWS load balancer -->
  <g filter="url(#shadow)">
    <rect x="60" y="372" width="230" height="86" rx="12" fill="#FFFFFF" stroke="#D9861A" stroke-width="2"/>
  </g>
  <text x="175" y="404" text-anchor="middle" font-size="17" font-weight="700" fill="#1E4E79">AWS load balancer</text>
  <text x="175" y="426" text-anchor="middle" font-size="12.5" fill="#595959">forwards TCP :443</text>
  <text x="175" y="443" text-anchor="middle" font-size="12.5" fill="#595959">to the worker nodes</text>

  <!-- LB -> workers -->
  <path d="M290,415 L444,415" fill="none" stroke="#09287D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
  <text x="334" y="435" text-anchor="middle" font-size="13" font-weight="700" fill="#09287D">:443</text>
  <path d="M290,440 C470,515 900,515 966,466" fill="none" stroke="#09287D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
  <text x="700" y="486" text-anchor="middle" font-size="13" font-weight="700" fill="#09287D">:443</text>

  <!-- browser -->
  <g filter="url(#shadow)">
    <rect x="60" y="508" width="230" height="72" rx="12" fill="#FFFFFF" stroke="#9FB3C8" stroke-width="1.5"/>
  </g>
  <text x="175" y="536" text-anchor="middle" font-size="16" font-weight="700" fill="#1E4E79">Your browser</text>
  <text x="175" y="558" text-anchor="middle" font-size="11" fill="#595959">https://*.&lt;LABNAME&gt;.training.tigera.ca</text>
  <path d="M175,508 L175,465" fill="none" stroke="#09287D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>

  <!-- Legend -->
  <g font-size="13" fill="#595959">
    <rect x="60" y="610" width="1080" height="50" rx="10" fill="#F6F8FB" stroke="#E1E7EE"/>
    <text x="84" y="640"><tspan font-weight="700" fill="#1E4E79">Networks</tspan>   Hosts 10.0.1.0/24 (AWS subnet)   ·   Pods 10.48.0.0/16 (kubeadm --pod-network-cidr)   ·   Services 10.49.0.0/16 (kubeadm --service-cidr)</text>
  </g>
</svg>
