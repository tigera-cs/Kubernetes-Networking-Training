<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>yaobank: a three-tier sample application</title>
  <defs>
    <style>@font-face{font-family:'Poppins';font-weight:400;src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:'Poppins';font-weight:700;src:url(data:font/woff;base64,) format('woff');}</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#09287D"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#09287D" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1000" height="600" rx="16" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="999" height="599" rx="16" fill="none" stroke="#D5DEE8"/>

  <!-- Title -->
  <text x="30" y="52" font-size="26" font-weight="700" fill="#1E4E79">yaobank: Yet Another Online Bank</text>
  <text x="30" y="78" font-size="14" fill="#595959">A three-tier sample application in the yaobank namespace, used throughout the training</text>

  <!-- User -->
  <g filter="url(#shadow)">
    <rect x="30" y="250" width="110" height="84" rx="12" fill="#FFFFFF" stroke="#9FB3C8" stroke-width="1.5"/>
  </g>
  <text x="85" y="284" text-anchor="middle" font-size="17" font-weight="700" fill="#1E4E79">You</text>
  <text x="85" y="306" text-anchor="middle" font-size="12" fill="#595959">browser or curl</text>

  <!-- Namespace -->
  <rect x="185" y="105" width="785" height="390" rx="14" fill="#EEF5FB" stroke="#1084B7" stroke-width="2"/>
  <text x="207" y="136" font-size="15" font-weight="700" fill="#09287D">namespace: yaobank</text>

  <!-- Tier columns: customer 215-415, summary 480-680, database 750-950 -->

  <!-- Services (pills) -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="215" y="160" width="200" height="44" rx="22" fill="#FFFFFF" stroke="#1084B7" stroke-width="1.5"/>
    <text x="315" y="179" fill="#1E4E79" font-weight="700">Service customer</text>
    <text x="315" y="196" fill="#595959">port :80</text>

    <rect x="480" y="160" width="200" height="44" rx="22" fill="#FFFFFF" stroke="#1084B7" stroke-width="1.5"/>
    <text x="580" y="179" fill="#1E4E79" font-weight="700">Service summary</text>
    <text x="580" y="196" fill="#595959">port :80</text>

    <rect x="750" y="160" width="200" height="44" rx="22" fill="#FFFFFF" stroke="#1084B7" stroke-width="1.5"/>
    <text x="850" y="179" fill="#1E4E79" font-weight="700">Service database</text>
    <text x="850" y="196" fill="#595959">port :2379</text>
  </g>
  <!-- service to pods -->
  <g stroke="#9FB3C8" stroke-width="2" stroke-dasharray="4 4">
    <line x1="315" y1="204" x2="315" y2="240"/>
    <line x1="580" y1="204" x2="580" y2="232"/>
    <line x1="850" y1="204" x2="850" y2="240"/>
  </g>

  <!-- customer pod -->
  <g filter="url(#shadow)">
    <rect x="215" y="240" width="200" height="104" rx="12" fill="#1084B7"/>
  </g>
  <text x="315" y="274" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">customer</text>
  <text x="315" y="298" text-anchor="middle" font-size="13.5" fill="#FFFFFF">1 pod</text>
  <text x="315" y="324" text-anchor="middle" font-size="11.5" fill="#DDEFF7">calico/yaobank-customer</text>

  <!-- summary pods (two, stacked) -->
  <rect x="492" y="232" width="200" height="104" rx="12" fill="#3F6E9A"/>
  <g filter="url(#shadow)">
    <rect x="480" y="244" width="200" height="104" rx="12" fill="#1E4E79"/>
  </g>
  <text x="580" y="278" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">summary</text>
  <text x="580" y="302" text-anchor="middle" font-size="13.5" fill="#FFFFFF">2 pods</text>
  <text x="580" y="328" text-anchor="middle" font-size="11.5" fill="#D3E0EE">calico/yaobank-summary</text>

  <!-- database pod -->
  <g filter="url(#shadow)">
    <rect x="750" y="240" width="200" height="104" rx="12" fill="#09287D"/>
  </g>
  <text x="850" y="274" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">database</text>
  <text x="850" y="298" text-anchor="middle" font-size="13.5" fill="#FFFFFF">1 pod · etcd</text>
  <text x="850" y="324" text-anchor="middle" font-size="11.5" fill="#C9D6F2">calico/yaobank-database</text>

  <!-- request path -->
  <path d="M140,292 L209,292" fill="none" stroke="#09287D" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="162" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#09287D">HTTP</text>
  <path d="M415,296 L474,296" fill="none" stroke="#09287D" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="446" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#09287D">HTTP</text>
  <path d="M692,296 L744,296" fill="none" stroke="#09287D" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="720" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#09287D">etcd</text>

  <!-- tier captions -->
  <g text-anchor="middle">
    <text x="315" y="392" font-size="15" font-weight="700" fill="#1E4E79">Web front end</text>
    <text x="315" y="414" font-size="12.5" fill="#595959">serves the bank's web GUI</text>
    <text x="580" y="392" font-size="15" font-weight="700" fill="#1E4E79">Business logic</text>
    <text x="580" y="414" font-size="12.5" fill="#595959">middleware, load-balanced over two pods</text>
    <text x="850" y="392" font-size="15" font-weight="700" fill="#1E4E79">Data store</text>
    <text x="850" y="414" font-size="12.5" fill="#595959">persistent bank data</text>
  </g>

  <!-- request flow note inside namespace -->
  <rect x="215" y="440" width="735" height="34" rx="17" fill="#FFFFFF" stroke="#BFD3E6"/>
  <text x="582" y="462" text-anchor="middle" font-size="13" fill="#1E4E79">Each tier calls the next one by its Service name: customer → <tspan font-weight="700">summary:80</tspan> → <tspan font-weight="700">database:2379</tspan></text>

  <!-- Legend -->
  <g font-size="12" fill="#595959">
    <rect x="30" y="525" width="940" height="46" rx="10" fill="#F6F8FB" stroke="#E1E7EE"/>
    <rect x="50" y="538" width="40" height="20" rx="10" fill="#FFFFFF" stroke="#1084B7" stroke-width="1.5"/>
    <text x="98" y="553">Kubernetes Service: a stable virtual IP and DNS name in front of the pods</text>
    <rect x="560" y="538" width="30" height="20" rx="5" fill="#1E4E79"/>
    <text x="598" y="553">Pods of a Deployment</text>
    <path d="M780,548 L826,548" stroke="#09287D" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="836" y="553">Request path</text>
  </g>
</svg>
